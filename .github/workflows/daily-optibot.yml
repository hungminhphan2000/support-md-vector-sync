name: Daily optibot job

on:
  schedule:
    # Once per day at 06:00 UTC.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optibot-job:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build optibot-job image
        run: docker build -t optibot-job .

      - name: Run optibot-job
        env:
          API_KEY: ${{ secrets.API_KEY }}
          VECTOR_STORE_ID: ${{ secrets.VECTOR_STORE_ID }}
        run: |
          set -euo pipefail
          docker run --rm \
            -e API_KEY \
            -e VECTOR_STORE_ID \
            optibot-job 2>&1 | tee /tmp/optibot-out.txt

      - name: Write docs/last-run.txt
        run: |
          set -euo pipefail
          {
            echo "ran_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            grep -E '^(added|updated|skipped|failed|removed_old|refresh_articles|completed_file_count|in_progress_file_count|failed_file_count|total_file_count|indexed_chunk_count_field)=' \
              /tmp/optibot-out.txt
          } > docs/last-run.txt
          cat docs/last-run.txt

      - name: Commit docs/last-run.txt
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/last-run.txt
          if git diff --staged --quiet; then
            echo "docs/last-run.txt unchanged"
            exit 0
          fi
          git commit -m "chore: update docs/last-run.txt"
          git push
